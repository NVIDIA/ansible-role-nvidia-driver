---
dependency:
  name: galaxy
driver:
  name: docker
platforms:

  - name: ubuntu-2204-canonical
    image: geerlingguy/docker-ubuntu2204-ansible
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: true
    privileged: true
    groups:
    - canonical_repo
    - ubuntu

  - name: ubuntu-2204-canonical-noserver
    image: geerlingguy/docker-ubuntu2204-ansible
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: true
    privileged: true
    groups:
    - canonical_repo
    - canonical_repo_noserver
    - ubuntu

  - name: ubuntu-2204-cuda
    image: geerlingguy/docker-ubuntu2204-ansible
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: true
    privileged: true
    groups:
    - cuda_repo
    - ubuntu

  - name: ubuntu-2404-canonical
    image: geerlingguy/docker-ubuntu2404-ansible
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: true
    privileged: true
    groups:
    - canonical_repo
    - ubuntu

  - name: ubuntu-2404-cuda
    image: geerlingguy/docker-ubuntu2404-ansible
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: true
    privileged: true
    groups:
    - cuda_repo
    - ubuntu

  - name: rockylinux-8
    image: geerlingguy/docker-rockylinux8-ansible
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: true
    privileged: true
    groups:
    - el8

  - name: rockylinux-9
    image: geerlingguy/docker-rockylinux9-ansible
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: true
    privileged: true

provisioner:
  name: ansible
  config_options:
    defaults:
      # The container images do not provide a writable home for the
      # connecting user, so Ansible cannot create its default remote
      # temporary directory under ~/.ansible/tmp.
      remote_tmp: /tmp/.ansible/tmp
  ansible_args:
  - -vv
  inventory:
    group_vars:
      all:
        nvidia_driver_skip_reboot: true
      canonical_repo:
        nvidia_driver_ubuntu_install_from_cuda_repo: false
      canonical_repo_noserver:
        nvidia_driver_ubuntu_packages_suffix: ""
      cuda_repo:
        nvidia_driver_ubuntu_install_from_cuda_repo: true
      el8:
        # The EL8 image ships only Python 3.6 as /usr/bin/python3, which is
        # too old for current ansible-core modules. prepare.yml installs
        # Python 3.9 and this points the interpreter at it.
        ansible_python_interpreter: /usr/bin/python3.9
verifier:
  name: ansible
